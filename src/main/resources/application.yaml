spring:
  application:
    name: aicouncil

  security:
    user:
      name: disabled
      password: disabled
  profiles:
    active: test

  datasource:
    url: jdbc:h2:file:./data/aicouncil
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update


# Cloud platforms (Railway/Render) inject $PORT; default to 8080 locally
server:
  port: ${PORT:8080}

# 🔑 OpenRouter configuration
openrouter:
  api-key: ${OPENROUTER_API_KEY}
  base-url: https://openrouter.ai/api/v1
  # Fastest verified free model (benchmark: ~8s/agent vs ~41s for openrouter/free)
  model: poolside/laguna-s-2.1:free
