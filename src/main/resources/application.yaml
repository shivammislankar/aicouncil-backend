spring:
  application:
    name: aicouncil

  security:
    user:
      name: disabled
      password: disabled

  datasource:
    url: jdbc:h2:file:./data/aicouncil
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update

  # --- Email OTP verification -------------------------------------------
  # Gmail SMTP with an App Password (no credit card, no custom domain).
  # Nothing here sends until OTP_ENABLED=true, so a deploy can never break
  # sign-ups while the credentials are still missing.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000


# Cloud platforms (Railway/Render) inject $PORT; default to 8080 locally
server:
  port: ${PORT:8080}
  # Render terminates TLS and forwards the client address in X-Forwarded-For.
  forward-headers-strategy: framework

app:
  cors:
    # Comma-separated. Add http://localhost:5173 locally via CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://ai-council-one-livid.vercel.app}

# Abuse / quota protection for POST /api/council/ask.
# Each question costs ~5 LLM calls; the free tiers give the whole site a few
# hundred calls a day, so these defaults keep one account from draining it.
rate-limit:
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  max-per-window: ${RATE_LIMIT_MAX_PER_WINDOW:5}
  per-user-daily: ${RATE_LIMIT_PER_USER_DAILY:25}
  global-daily: ${RATE_LIMIT_GLOBAL_DAILY:200}

council:
  # Hard cap on one council run (all five stages, retries included).
  time-budget-seconds: ${COUNCIL_TIME_BUDGET_SECONDS:150}

otp:
  enabled: ${OTP_ENABLED:false}
  # Codes live for 10 minutes and allow 5 wrong guesses before expiring.
  ttl-seconds: ${OTP_TTL_SECONDS:600}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  from: ${MAIL_FROM:${MAIL_USERNAME:}}
  # How many codes one account may request inside the resend window.
  max-requests-per-window: ${OTP_MAX_REQUESTS:3}
  resend-window-seconds: ${OTP_RESEND_WINDOW:600}
  # Site-wide cap on verification emails per UTC day (Gmail allows ~500/day).
  max-emails-per-day: ${OTP_MAX_EMAILS_PER_DAY:300}


# 🔑 LLM configuration — ordered provider chain with automatic failover.
# Both are OpenAI-compatible endpoints on free tiers (no card required).
llm:
  gemini:
    # Google Gemini free tier: only ~20 requests/day PER MODEL
    # (GenerateRequestsPerDayPerProjectPerModel-FreeTier) — so we rotate
    # across every available model; FallbackChatModel skips any that is
    # currently rate-limited without even making the call.
    base-url: https://generativelanguage.googleapis.com/v1beta/openai/
    api-key: ${GEMINI_API_KEY}
    models: gemini-3.5-flash-lite, gemini-3.7-flash, gemini-3.6-flash, gemini-3.5-flash, gemini-3.8-flash
  groq:
    # Groq free tier: 1,000 requests/day on gpt-oss-120b — final safety net.
    base-url: https://api.groq.com/openai/v1
    api-key: ${GROQ_API_KEY}
    model: openai/gpt-oss-120b
