# Render blueprint: provisioning this repo creates a free web service.
# Build config for the Spring Boot backend.
services:
  - type: web
    name: aicouncil-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Keep the JVM under Render's 512MB free-tier memory limit
      - key: JAVA_TOOL_OPTIONS
        value: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m"
      # Filled in during Blueprint setup (prompted, not stored in git)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
