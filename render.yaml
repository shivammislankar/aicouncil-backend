# Render blueprint: provisioning this repo creates a free web service.
# Build config for the Spring Boot backend.
services:
  - type: web
    name: aicouncil-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Keep the JVM under Render's 512MB free-tier memory limit
      - key: JAVA_TOOL_OPTIONS
        value: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m"
      # Filled in during Blueprint setup (prompted, not stored in git)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Email OTP via Gmail SMTP. Leave OTP_ENABLED=false until a Gmail App
      # Password exists; the app runs fine without verification meanwhile.
      # NOTE: while this is "false", email verification is OFF and every
      # account can use the council. Set it to "true" in the Render dashboard
      # once MAIL_USERNAME / MAIL_PASSWORD are filled in.
      - key: OTP_ENABLED
        value: "false"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # Optional: comma-separated frontend origins allowed by CORS.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ai-council-one-livid.vercel.app"
